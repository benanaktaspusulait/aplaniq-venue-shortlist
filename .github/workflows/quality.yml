name: Rust quality gates

'on':
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned compiler and MSRV
        shell: bash
        run: |
          pinned=$(awk -F '"' '/^channel[[:space:]]*=/ {print $2; exit}' rust-toolchain.toml)
          msrv=$(awk -F '"' '/^rust-version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          : "${pinned:?Missing compiler pin}" "${msrv:?Missing minimum Rust version}"
          rustup toolchain install "$pinned" --profile minimal --component rustfmt,clippy
          if [ "$msrv" != "$pinned" ]; then
            rustup toolchain install "$msrv" --profile minimal
          fi
      - name: Run the local quality gate
        run: sh scripts/quality-gate.sh --major
